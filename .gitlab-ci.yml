stages:
  - build

variables:
  REGISTRY: $CI_REGISTRY
  IOC_IMAGE: $CI_REGISTRY_IMAGE/ioc:$CI_COMMIT_REF_SLUG
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_SLUG

build-containers:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IOC_IMAGE ./ioc
    - docker push $IOC_IMAGE
    - docker build -t $WEB_IMAGE ./web
    - docker push $WEB_IMAGE
  only:
    - main
    - master
    - tags 